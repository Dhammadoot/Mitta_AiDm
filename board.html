<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitta AI - Board</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #2c3e50; color: white; font-family: sans-serif; text-align: center; flex-direction: column; margin: 0;}
        h1 { font-size: 50px; color: #ecf0f1; }
        #display { font-size: 45px; color: #f1c40f; margin-top: 30px; padding: 20px; border: 2px dashed #f1c40f; border-radius: 15px;}
    </style>
</head>
<body>
    <h1>🖥️ Mitta AI स्मार्ट बोर्ड</h1>
    <div id="display">रिमोटवरून कमांड येण्याची वाट पाहत आहे... ⏳</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAWQicAHRHSHzaS_AtwMXfsJQ0nZYCpM6c",
          authDomain: "mitta-ai.firebaseapp.com",
          databaseURL: "https://mitta-ai-default-rtdb.firebaseio.com",
          projectId: "mitta-ai",
          storageBucket: "mitta-ai.firebasestorage.app",
          messagingSenderId: "628117773605",
          appId: "1:628117773605:web:99c4c2df635a6990d70ecc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const displayDiv = document.getElementById('display');

        onValue(ref(db, 'action'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.command) {
                displayDiv.innerText = "✨ " + data.command + " ✨";
            }
        });
    </script>
</body>
</html>
