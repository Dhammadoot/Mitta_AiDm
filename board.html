<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitta AI - Speaking Board</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #8e44ad; color: white; font-family: sans-serif; text-align: center; flex-direction: column; margin: 0; padding: 20px;}
        h1 { font-size: 35px; margin-bottom: 10px; color: #f39c12; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        #box { font-size: 38px; background: white; color: #2c3e50; padding: 30px; border-radius: 20px; box-shadow: 0px 10px 25px rgba(0,0,0,0.3); width: 85%; max-width: 800px; min-height: 150px; display: flex; align-items: center; justify-content: center; }
        .speaker-icon { font-size: 50px; margin-bottom: 15px; animation: bounce 1.5s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <div class="speaker-icon">🗣️</div>
    <h1>Mitta AI लाईव्ह क्लासरूम</h1>
    <div id="box">नमस्कार बालमित्रांनो! मी Mitta AI आहे. रिमोटवरून बटन दाबा, मी बोलेन!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAWQicAHRHSHzaS_AtwMXfsJQ0nZYCpM6c",
          authDomain: "mitta-ai.firebaseapp.com",
          databaseURL: "https://mitta-ai-default-rtdb.firebaseio.com",
          projectId: "mitta-ai",
          storageBucket: "mitta-ai.firebasestorage.app",
          messagingSenderId: "628117773605",
          appId: "1:628117773605:web:99c4c2df635a6990d70ecc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const box = document.getElementById('box');

        // सर्व उपलब्ध आवाज आधीच लोड करून ठेवणे
        let voices = [];
        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
        }
        // जेव्हा ब्राउझरमध्ये आवाज लोड होतील, तेव्हा हे फंक्शन चालेल
        window.speechSynthesis.onvoiceschanged = loadVoices;

        // मराठी लेडीज आवाजात बोलण्याचे फंक्शन
        function speakMarathi(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // आधीचे बोलणे थांबवा

                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'mr-IN'; 
                utterance.rate = 0.85;  // वेग थोडा अजून कमी केला जेणेकरून उच्चार स्पष्ट येतील
                utterance.pitch = 1.2; 

                if (voices.length === 0) {
                    voices = window.speechSynthesis.getVoices();
                }

                // १. प्रथम मराठी आवाज शोधण्याचा प्रयत्न करणे
                let bestVoice = voices.find(v => v.lang === 'mr-IN' || v.lang.includes('mr'));
                
                // २. जर मराठी आवाज नाही मिळाला, तर हिंदी आवाज वापरणे (कारण हिंदीचा उच्चारही मराठीला सूट होतो)
                if (!bestVoice) {
                    bestVoice = voices.find(v => v.lang === 'hi-IN' || v.lang.includes('hi'));
                }

                if (bestVoice) {
                    utterance.voice = bestVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        onValue(ref(db, 'action'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.content) {
                box.innerText = data.content;
                speakMarathi(data.content);
            }
        });

        // पेज लोड झाल्यावर एकदा आवाज लोड करण्याचा प्रयत्न
        setTimeout(loadVoices, 1000);
    </script>
</body>
</html>
