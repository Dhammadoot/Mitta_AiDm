<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitta AI - MPSC Board</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1abc9c; color: white; font-family: sans-serif; text-align: center; flex-direction: column; margin: 0; padding: 20px;}
        h1 { font-size: 35px; margin-bottom: 10px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        #box { font-size: 38px; background: white; color: #2c3e50; padding: 30px; border-radius: 20px; box-shadow: 0px 10px 25px rgba(0,0,0,0.3); width: 85%; max-width: 800px; min-height: 150px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <h1>📖 MPSC / सरळ सेवा GS & GK लाईव्ह बोर्ड</h1>
    <div id="box">रिमोटवरून प्रश्न येण्याची वाट पाहत आहे... ⏳</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAWQicAHRHSHzaS_AtwMXfsJQ0nZYCpM6c",
          authDomain: "mitta-ai.firebaseapp.com",
          databaseURL: "https://mitta-ai-default-rtdb.firebaseio.com",
          projectId: "mitta-ai",
          storageBucket: "mitta-ai.firebasestorage.app",
          messagingSenderId: "628117773605",
          appId: "1:628117773605:web:99c4c2df635a6990d70ecc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const box = document.getElementById('box');

        onValue(ref(db, 'action'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.content) {
                box.innerText = data.content;
            }
        });
    </script>
</body>
</html>
