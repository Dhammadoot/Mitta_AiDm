<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitta AI - Advanced Remote</title>
    <style>
        body { text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; background: linear-gradient(135deg, #f5f7fa, #c3cfe2); min-height: 100vh; margin: 0; box-sizing: border-box; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        
        .mic-btn { 
            font-size: 50px; 
            padding: 30px; 
            border-radius: 50%; 
            background: linear-gradient(45deg, #ff416c, #ff4b2b); 
            color: white; 
            border: none; 
            box-shadow: 0 10px 25px rgba(255, 65, 108, 0.4); 
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
        }
        .mic-btn:active { transform: scale(0.95); }
        
        #status { 
            font-size: 16px; 
            font-weight: bold; 
            color: #2c3e50; 
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            max-width: 400px;
            margin: 0 auto 15px auto;
            word-wrap: break-word;
        }

        .btn-grid { display: flex; flex-direction: column; gap: 10px; max-width: 400px; margin: 0 auto; }
        .action-btn { font-size: 16px; padding: 12px; border-radius: 10px; background: #2980b9; color: white; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; }
        .timer-btn { background: #e67e22; }
    </style>
</head>
<body>
    <h1>🧠 Mitta AI प्रगत रिमोट</h1>
    <p>माईक किंवा बटणांच्या मदतीने क्लास कन्ट्रोल करा</p>
    
    <button class="mic-btn" id="micBtn" onclick="startListening()">🎙️</button>
    <div id="status">माईक बटण दाबून बोला...</div>

    <div class="btn-grid">
        <button class="action-btn timer-btn" onclick="triggerTimer(30)">⏱️ ३० सेकंदाचा टाईमर लावा</button>
        <button class="action-btn" onclick="sendToBoard('महाराष्ट्राची राजधानी मुंबई आहे.')">🏛️ राजधानी प्रश्न पाठवा</button>
        <button class="action-btn" onclick="sendToBoard('राष्ट्रपिता महात्मा गांधी आहेत.')">🇮🇳 राष्ट्रपिता प्रश्न पाठवा</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAWQicAHRHSHzaS_AtwMXfsJQ0nZYCpM6c",
          authDomain: "mitta-ai.firebaseapp.com",
          databaseURL: "https://mitta-ai-default-rtdb.firebaseio.com",
          projectId: "mitta-ai",
          storageBucket: "mitta-ai.firebasestorage.app",
          messagingSenderId: "628117773605",
          appId: "1:628117773605:web:99c4c2df635a6990d70ecc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.sendToBoard = function(text) {
            set(ref(db, 'action'), {
                content: text,
                time: Date.now()
            });
            document.getElementById('status').innerText = "✅ पाठवले: " + text;
        }

        window.triggerTimer = function(sec) {
            set(ref(db, 'timer'), {
                time: sec,
                timeKey: Date.now()
            });
            document.getElementById('status').innerText = "⏱️ ३० सेकंदाचा टाईमर चालू केला!";
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'mr-IN'; 
            recognition.continuous = false;

            window.startListening = function() {
                document.getElementById('status').innerText = "👂 ऐकत आहे... बोला!";
                recognition.start();
            };

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('status').innerText = "तुम्ही बोललात: " + spokenText;
                sendToBoard(spokenText);
            };

            recognition.onerror = function() {
                document.getElementById('status').innerText = "आवाज स्पष्ट आला नाही. पुन्हा प्रयत्न करा.";
            };
        }
    </script>
</body>
</html>
