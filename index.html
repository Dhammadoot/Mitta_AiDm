<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitta AI - MPSC Remote</title>
    <style>
        body { text-align: center; font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        h1 { color: #2c3e50; font-size: 24px; }
        .btn { font-size: 18px; padding: 12px 20px; margin: 10px; border-radius: 10px; background: #27ae60; color: white; border: none; width: 90%; box-shadow: 2px 2px 5px gray; }
        .btn-next { background: #2980b9; }
        .btn-ans { background: #e67e22; }
    </style>
</head>
<body>
    <h1>📚 Mitta AI स्पर्धा परीक्षा रिमोट</h1>
    <p>विषय: GS आणि GK (MPSC / सरळ सेवा)</p>
    
    <button class="btn" onclick="sendData('Q1', 'भारताचे पहिले सरन्यायाधीश कोण होते?')">१. पहिला प्रश्न पाठवा</button>
    <button class="btn btn-ans" onclick="sendData('ANS', 'उत्तर: न्यायमूर्ती एच. जे. कनिया')">२. उत्तर दाखवा</button>
    <button class="btn btn-next" onclick="sendData('Q2', 'महाराष्ट्राचे राज्यप्राणी कोणता आहे?')">३. पुढील प्रश्न पाठवा</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAWQicAHRHSHzaS_AtwMXfsJQ0nZYCpM6c",
          authDomain: "mitta-ai.firebaseapp.com",
          databaseURL: "https://mitta-ai-default-rtdb.firebaseio.com",
          projectId: "mitta-ai",
          storageBucket: "mitta-ai.firebasestorage.app",
          messagingSenderId: "628117773605",
          appId: "1:628117773605:web:99c4c2df635a6990d70ecc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.sendData = function(type, text) {
            set(ref(db, 'action'), {
                type: type,
                content: text,
                time: Date.now()
            });
            alert("बोर्डवर पाठवले: " + text);
        };
    </script>
</body>
</html>
